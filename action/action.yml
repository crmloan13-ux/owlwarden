name: owlwarden
description: >
  Run owlwarden in CI with the same exit codes as the CLI (0 clean, 1 findings,
  2 error). Thin wrapper — it does not re-score findings (ADR 0017).
author: owlwarden
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Project path to scan (relative to the workspace). No newlines.
    required: false
    default: "."
  version:
    description: npm package version or dist-tag for `npx owlwarden@…` (semver or tag only).
    required: false
    default: "1.2.0"
  preset:
    description: >
      Rule set (`quick`, `owasp-top10`, `deep`, `agent-surface`). `agent-surface`
      scans the agent workspace — hooks, MCP entries, instruction files — rather
      than the application code.
    required: false
    default: "quick"
  since:
    description: >
      Scan only what changed since this git ref, plus untracked files. Needs
      history: set `fetch-depth: 0` on checkout, or pass the PR base SHA. A diff
      scope is not a baseline — the scope is stated in the report.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that fails the job (`high` / `medium` / `low` / `info`).
    required: false
    default: "medium"
  min-confidence:
    description: Minimum confidence that fails the job (`confirmed` / `likely` / `possible`).
    required: false
    default: "likely"
  format:
    description: Report format (`json`, `sarif`, `junit`, or `md`).
    required: false
    default: "sarif"
  out:
    description: Path to write the report (relative to the workspace). No newlines.
    required: false
    default: "owlwarden-results.sarif"
  baseline:
    description: Optional baseline file. Requires allow-baseline=true on untrusted PRs.
    required: false
    default: ""
  allow-baseline:
    description: Permit --baseline under --ci (trusted trees only).
    required: false
    default: "false"
  allow-suppressions:
    description: Permit inline suppressions under --ci (trusted trees only).
    required: false
    default: "false"
  allow-project-config:
    description: Permit project preset/failOn/minConfidence under --ci.
    required: false
    default: "false"
  osv:
    description: Pass --osv (opt-in Google OSV lockfile lookup). Off by default.
    required: false
    default: "false"
  fail-on-exposure:
    description: >
      Also fail at this reachability or above (`internet` / `authenticated` /
      `internal` / `unknown`). Composes with fail-on as an OR: either one trips
      the exit code. Empty leaves the gate off.
    required: false
    default: ""
  seal:
    description: >
      Verify `.owlwarden/surface.lock` after the scan. `off` (default) skips it;
      `verify` fails the job on drift; `report` writes the surface diff to the
      step summary and never changes the exit code. Silent when the surface has
      not moved — a comment that appears on every pull request is a comment
      nobody reads.
    required: false
    default: "off"
  require-signed-seal:
    description: >
      Refuse an unsigned seal, or one whose signature does not verify against
      OWLWARDEN_SEAL_TRUST. Meaningful only with seal set.
    required: false
    default: "false"

outputs:
  seal-diff:
    description: The surface diff, when `seal` was enabled and the surface moved.
    value: ${{ steps.scan.outputs.seal-diff }}
  report-path:
    description: Absolute path of the written report.
    value: ${{ steps.scan.outputs.report-path }}
  exit-code:
    description: owlwarden exit code (0 / 1 / 2).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: "20"

    - name: Run owlwarden
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ALLOW_BASELINE: ${{ inputs.allow-baseline }}
        INPUT_ALLOW_SUPPRESSIONS: ${{ inputs.allow-suppressions }}
        INPUT_ALLOW_PROJECT_CONFIG: ${{ inputs.allow-project-config }}
        INPUT_OSV: ${{ inputs.osv }}
        INPUT_FAIL_ON_EXPOSURE: ${{ inputs.fail-on-exposure }}
        INPUT_SEAL: ${{ inputs.seal }}
        INPUT_REQUIRE_SIGNED_SEAL: ${{ inputs.require-signed-seal }}
      run: |
        set -euo pipefail

        # Reject newlines so values cannot forge a key in GITHUB_OUTPUT. No
        # generic `args` input — that was a mute-switch / RCE footgun.
        #
        # There is no NUL check, deliberately. There used to be, written as
        # `[[ "$value" == *$'\0'* ]]`, and it rejected every input this Action
        # was ever given: bash cannot hold a NUL in a string, so `$'\0'` expands
        # to the empty string and the pattern is `**`. A NUL also cannot reach
        # here in the first place — `execve` passes the environment as
        # NUL-terminated strings, so a NUL is a terminator, not a value. The
        # check was impossible to pass and unnecessary to have.
        reject_meta() {
          local name="$1" value="$2"
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "error: ${name} must not contain CR/LF" >&2
            exit 2
          fi
        }

        # A value that begins with `-` is a flag, not a value. `path` is passed as
        # a positional and the CLI's parser resolves it as an option: a workflow
        # that wires `path:` to anything a contributor can influence — a
        # workflow_dispatch input, a matrix entry read out of the tree — would
        # otherwise let that value become `--target=http://169.254.169.254` or
        # `--plugin=./evil.wasm`, turning a scan step into egress or code
        # loading. The `--` below is the real fix; this is the belt, because it
        # also stops the same value being silently swallowed as the argument to
        # the option in front of it.
        reject_dash() {
          local name="$1" value="$2"
          if [[ "$value" == -* ]]; then
            echo "error: ${name} must not begin with '-'" >&2
            exit 2
          fi
        }

        reject_meta path "${INPUT_PATH}"
        reject_meta version "${INPUT_VERSION}"
        reject_meta preset "${INPUT_PRESET}"
        reject_meta since "${INPUT_SINCE}"
        reject_meta fail-on "${INPUT_FAIL_ON}"
        reject_meta min-confidence "${INPUT_MIN_CONFIDENCE}"
        reject_meta format "${INPUT_FORMAT}"
        reject_meta out "${INPUT_OUT}"
        reject_meta baseline "${INPUT_BASELINE}"
        reject_meta fail-on-exposure "${INPUT_FAIL_ON_EXPOSURE:-}"
        reject_meta seal "${INPUT_SEAL:-}"

        reject_dash path "${INPUT_PATH}"
        reject_dash out "${INPUT_OUT}"
        reject_dash baseline "${INPUT_BASELINE}"
        reject_dash since "${INPUT_SINCE}"

        # A ref, not a revision range and not an option. `..` and `...` are legal
        # in `git diff` and would silently widen the scope past what the caller
        # asked for, so they are refused rather than passed along.
        if [[ -n "${INPUT_SINCE}" ]]; then
          if [[ ! "${INPUT_SINCE}" =~ ^[A-Za-z0-9][A-Za-z0-9._/^~-]*$ || "${INPUT_SINCE}" == *..* ]]; then
            echo "error: since must be a single git ref" >&2
            exit 2
          fi
        fi

        case "${INPUT_PRESET}" in
          quick|owasp-top10|deep|agent-surface) ;;
          *) echo "error: preset must be quick|owasp-top10|deep|agent-surface" >&2; exit 2 ;;
        esac
        case "${INPUT_FAIL_ON}" in
          high|medium|low|info) ;;
          *) echo "error: fail-on must be high|medium|low|info" >&2; exit 2 ;;
        esac
        case "${INPUT_MIN_CONFIDENCE}" in
          confirmed|likely|possible) ;;
          *) echo "error: min-confidence must be confirmed|likely|possible" >&2; exit 2 ;;
        esac
        case "${INPUT_FORMAT}" in
          json|sarif|junit|md) ;;
          *) echo "error: format must be json|sarif|junit|md" >&2; exit 2 ;;
        esac
        case "${INPUT_FAIL_ON_EXPOSURE:-}" in
          ""|internet|authenticated|internal|unknown) ;;
          *) echo "error: fail-on-exposure must be internet|authenticated|internal|unknown" >&2; exit 2 ;;
        esac
        # Normalised once. An empty value means the caller is pinned to a
        # version of this Action that predates the input, and the answer for
        # them is the 1.1 behaviour rather than an error.
        seal_mode="${INPUT_SEAL:-off}"
        [[ -z "${seal_mode}" ]] && seal_mode="off"
        case "${seal_mode}" in
          off|verify|report) ;;
          *) echo "error: seal must be off|verify|report" >&2; exit 2 ;;
        esac
        # Semver, prerelease, or a simple npm dist-tag — never shell metacharacters.
        if [[ ! "${INPUT_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
          echo "error: version looks unsafe for npx owlwarden@…" >&2
          exit 2
        fi
        if [[ "${INPUT_OUT}" == /* || "${INPUT_OUT}" == *..* ]]; then
          echo "error: out must be a relative path without .." >&2
          exit 2
        fi
        if [[ "${INPUT_PATH}" == *..* ]]; then
          echo "error: path must not contain .." >&2
          exit 2
        fi

        out_path="${INPUT_OUT}"
        mkdir -p "$(dirname "$out_path")"
        cmd=(npx --yes "owlwarden@${INPUT_VERSION}" scan --ci
          --preset "${INPUT_PRESET}"
          --fail-on "${INPUT_FAIL_ON}"
          --min-confidence "${INPUT_MIN_CONFIDENCE}"
          --format "${INPUT_FORMAT}"
          --out "${out_path}")
        if [[ "${INPUT_ALLOW_BASELINE}" == "true" && -n "${INPUT_BASELINE}" ]]; then
          if [[ "${INPUT_BASELINE}" == /* || "${INPUT_BASELINE}" == *..* ]]; then
            echo "error: baseline must be a relative path without .." >&2
            exit 2
          fi
          cmd+=(--allow-baseline --baseline "${INPUT_BASELINE}")
        fi
        if [[ "${INPUT_ALLOW_SUPPRESSIONS}" == "true" ]]; then
          cmd+=(--allow-suppressions)
        fi
        if [[ "${INPUT_ALLOW_PROJECT_CONFIG}" == "true" ]]; then
          cmd+=(--allow-project-config)
        fi
        if [[ "${INPUT_OSV}" == "true" ]]; then
          cmd+=(--osv)
        fi
        if [[ -n "${INPUT_SINCE}" ]]; then
          cmd+=(--since "${INPUT_SINCE}")
        fi
        if [[ -n "${INPUT_FAIL_ON_EXPOSURE:-}" ]]; then
          cmd+=(--fail-on-exposure "${INPUT_FAIL_ON_EXPOSURE:-}")
        fi

        # Everything after `--` is a positional, whatever it looks like. This has
        # to come after the conditional flags above, which is why the path is
        # appended here rather than with the rest of the command.
        cmd+=(-- "${INPUT_PATH}")

        set +e
        "${cmd[@]}"
        code=$?
        set -e

        # The seal is verified after the scan, not instead of it. They answer
        # different questions — "is this configuration dangerous" and "is this
        # the configuration you agreed to" — and a job that ran only one of them
        # would report the other as clean.
        seal_diff=""
        if [[ "${seal_mode}" != "off" ]]; then
          seal_cmd=(npx --yes "owlwarden@${INPUT_VERSION}" seal --verify --ascii)
          if [[ "${INPUT_REQUIRE_SIGNED_SEAL:-}" == "true" ]]; then
            seal_cmd+=(--require-signed-seal)
          fi
          seal_cmd+=(-- "${INPUT_PATH}")
          set +e
          seal_diff="$("${seal_cmd[@]}" 2>&1)"
          seal_code=$?
          set -e

          if [[ "${seal_code}" -ne 0 ]]; then
            printf '%s\n' "${seal_diff}"
            # The step summary rather than a comment: writing a comment needs a
            # token with `pull-requests: write`, and an Action that asks for one
            # to report a security finding has widened the caller's blast radius
            # to say something it could say without it. A workflow that wants a
            # comment reads `seal-diff` and posts it with its own permissions.
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              {
                echo "### owlwarden — the agent execution surface moved"
                echo
                echo '```'
                printf '%s\n' "${seal_diff}"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ "${seal_mode}" == "verify" && "${code}" -eq 0 ]]; then
              code="${seal_code}"
            fi
          else
            # Silent when the surface has not moved. A comment that appears on
            # every pull request is a comment nobody reads.
            seal_diff=""
          fi
        fi

        # Multiline-safe GITHUB_OUTPUT — never interpolate untrusted paths into a
        # single echo key=value line (CR/LF would invent extra keys).
        {
          echo "report-path<<OWLWARDEN_EOF"
          echo "${GITHUB_WORKSPACE}/${out_path}"
          echo "OWLWARDEN_EOF"
          echo "seal-diff<<OWLWARDEN_EOF"
          printf '%s\n' "${seal_diff}"
          echo "OWLWARDEN_EOF"
          echo "exit-code=${code}"
        } >> "$GITHUB_OUTPUT"
        exit "${code}"
