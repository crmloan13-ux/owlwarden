[package]
name = "owlwarden-plugin-host"
description = "Sandboxed WASM plugin host for owlwarden, built on wasmtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
owlwarden-core.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

wasmtime.workspace = true
anyhow.workspace = true

# ADR 0021: SHA-256 digest of plugin.wasm before wasmtime compiles it.
sha2 = "0.10"
# ADR 0021: verify-only ed25519 detached signatures (.sig over raw digest).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wat.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
