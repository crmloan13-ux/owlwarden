[package]
name = "owlwarden-transport"
description = "Bounded HTTP transport for owlwarden: scope-enforced, streaming-capped reqwest adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
owlwarden-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
# Justified in ADR 0014: TLS and HTTP/1.1 belong in a public crate, not a
# hand-rolled client inside a security scanner. default-features off so we do
# not silently enable cookies, gzip, or native-tls.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# RFC3339 `updatedAt` on the on-disk index — same crate core uses for report timestamps.
time = { workspace = true }
# `time` only — used to pace `--allow-active` requests. The reactor comes from
# the live-scan caller (napi / cli-native), not from this crate.
tokio = { version = "1", default-features = false, features = ["time"] }
url = { version = "2", default-features = false }

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
