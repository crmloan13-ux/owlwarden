[package]
name = "owlwarden-napi"
description = "napi-rs bindings exposing the owlwarden engine to Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
owlwarden-core.workspace = true
owlwarden-detectors.workspace = true
owlwarden-gate.workspace = true
owlwarden-dynamic.workspace = true
owlwarden-plugin-host.workspace = true
owlwarden-reporters.workspace = true
owlwarden-static.workspace = true
owlwarden-transport.workspace = true

futures-executor = "0.3"
serde.workspace = true
serde_json.workspace = true

# tokio_rt: async `scan` must not block the Node event loop — a sync scan that
# probes a server hosted in the same process deadlocks (the loop cannot accept).
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
