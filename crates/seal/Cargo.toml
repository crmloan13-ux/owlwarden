[package]
name = "owlwarden-seal"
description = "owlwarden surface lock: a semantic-digest record of the agent execution surface, with detached ed25519 verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
owlwarden-core.workspace = true
owlwarden-static.workspace = true
owlwarden-detectors.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# ADR 0021's primitives, reused unchanged: sha256 over content, verify-only
# ed25519 over the digest. Nothing here signs — see `SECURITY.md`.
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
