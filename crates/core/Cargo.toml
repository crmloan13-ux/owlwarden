[package]
name = "owlwarden-core"
description = "Engine core for owlwarden: finding model, ports (traits), scheduler, and resource limits. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# URL parsing for scope/target. Lives in core so Transport and the CLI share
# one validator — a hand-rolled parser here is how SSRF filters get bypassed.
url = { version = "2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
