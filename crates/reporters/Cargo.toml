[package]
name = "owlwarden-reporters"
description = "Built-in owlwarden reporters: pretty terminal output with code frames, and machine-readable JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
owlwarden-core.workspace = true

anstream.workspace = true
anstyle.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The snapshot tests render a report produced by the real engine rather than a
# hand-built one, so a change in what detectors emit shows up in the golden
# output instead of hiding behind a fixture written to match.
owlwarden-detectors.workspace = true
owlwarden-static.workspace = true

insta.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
