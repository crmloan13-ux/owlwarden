# cargo-deny configuration.
#
# A security tool that ships an unreviewed dependency tree is making an argument
# it does not believe. This runs in CI on every pull request.

[advisories]
# An advisory with no fix has to be dealt with, not waited out. If one must be
# tolerated temporarily, add the id here with a comment saying why and when it
# will be revisited — never silently.
yanked = "deny"
ignore = []

[licenses]
# We publish under MIT OR Apache-2.0, so everything we link has to be compatible
# with both. Copyleft is not a moral judgement here; it is a distribution
# problem for a prebuilt binary shipped through npm.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate usually means something transitive is out of date.
# A smell, not always a fault, so it is a warning.
multiple-versions = "warn"
# A `*` version requirement means the build is not reproducible.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
