name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR should cancel the first run, not queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors here rather than in the source, so a new compiler
  # release cannot fail everyone's local build the day it lands.
  RUSTFLAGS: -D warnings
  # Building needs a newer Node than running does, because pnpm 11 does.
  # Users are not asked to install this; see RUNTIME_NODE below.
  BUILD_NODE: 22
  # The oldest Node the published CLI claims to support. Tested, not assumed —
  # an untested engines field is a promise nobody checked.
  RUNTIME_NODE: 20

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware eslint rules resolve `@dointhai/owlwarden-sdk` through its emitted
      # declarations. Without them every cross-package type is `any`, and the
      # no-unsafe-* rules fire on correct code — a red build that says nothing.
      - run: pnpm build:ts
      - run: pnpm lint:js

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a day-one target, not a later port. Path handling, ANSI
        # output, and line endings all differ there, and all three have bitten
        # tools like this one.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:ts

      # The false-positive corpus is the number that decides whether anyone
      # keeps this installed. It gets its own step so a failure is unmissable
      # in the run summary.
      - name: false-positive corpus must stay silent
        shell: bash
        run: |
          for dir in fixtures/should-not-fire/*/; do
            echo "scanning $dir"
            node packages/cli/dist/bin.js scan "$dir" --ci > /tmp/report.json || {
              echo "::error::$dir produced findings"
              cat /tmp/report.json
              exit 1
            }
          done

      # The execution invariant is only meaningful where the runtimes exist.
      # `OWLWARDEN_REQUIRE_RUNTIMES` turns a missing one into a failure, so a
      # green build here means the fixes were checked against every runtime a
      # profile declares — not that the check quietly skipped three of four
      # (ADR 0031 §3).
      - name: install the runtimes the fix matrix is checked against
        if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@v2
      - name: install Deno
        if: runner.os == 'Linux'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: every un-deltaed fix runs on every declared runtime
        if: runner.os == 'Linux'
        env:
          # The runtimes that must be installed, named rather than implied. A
          # boolean here could only mean "all of them", and workerd has no
          # standalone interpreter to install on a runner — so the grid checks
          # it by API availability instead, and this list is where that
          # exclusion is reviewable rather than true by accident (ADR 0031 §3).
          OWLWARDEN_REQUIRE_RUNTIMES: bun,deno
        run: cargo test -p owlwarden-detectors --test runtime_execution -- --nocapture

      # The number that decides whether anyone believes the rest of the output.
      # Exits 2 while the corpus is empty, which is the honest state and not a
      # reason to skip the step — a benchmark nobody runs is a benchmark that
      # rots.
      - name: benchmark
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo run -p owlwarden-cli -- bench --format json --out bench/latest.json

      - name: generated docs are current
        if: runner.os == 'Linux'
        run: pnpm rules:check

      # The site is generated from the rule catalogue and from the fixtures, so
      # a rule change that nobody rebuilt for leaves a few hundred pages
      # describing behaviour the tool no longer has. Checked here rather than in
      # the Pages workflow because regenerating needs the engine, and Pages
      # deploys the committed directory without building Rust.
      - name: the generated site is current
        if: runner.os == 'Linux'
        run: pnpm site:check

      - name: the two READMEs meet their contracts
        if: runner.os == 'Linux'
        run: pnpm docs:check

      # Also a release gate, and that is where a wrong number is unrecoverable.
      # It runs here too because the two files most likely to go stale — the
      # Action's default `version` input and the MCP descriptor — fail silently
      # rather than loudly, so the release gate would be the first thing to
      # notice, on the day when noticing is most expensive.
      - name: every published version agrees
        if: runner.os == 'Linux'
        run: pnpm version:check

      # The fixture is generated because it holds invisible characters and
      # escape bytes: hand-editing a file whose contents cannot be seen is how
      # a case silently loses its payload and starts passing against anything.
      - name: the untrusted-text vectors are current
        if: runner.os == 'Linux'
        run: pnpm vectors:check

      # `engines: node >=20` in the published package is a promise to users,
      # and the build runs on a newer Node than that. Without this step the
      # promise is untested, and the first person to find out would be someone
      # on Node 20 watching an install fail.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RUNTIME_NODE }}
          # setup-node v5 caches automatically when package.json names a
          # package manager, which means running pnpm — and pnpm 11 cannot
          # start on the Node version we are deliberately downgrading to.
          # Nothing is installed in this step, so there is nothing to cache.
          package-manager-cache: false
      - name: the published CLI runs on the oldest supported Node
        shell: bash
        run: |
          node --version
          node packages/cli/dist/bin.js --version
          node packages/cli/dist/bin.js coverage
          node packages/cli/dist/bin.js scan fixtures/should-not-fire/next-api-clean --ci

  supply-chain:
    name: advisories + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
