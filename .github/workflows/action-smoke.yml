# Proves the CI surface: SARIF emit + exit 0 on a clean fixture.
# Uses the locally built CLI (npm may not have this version yet on a PR).
name: Action smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "action/**"
      - "crates/reporters/**"
      - "packages/cli/**"
      - "fixtures/should-not-fire/next-api-clean/**"
      - ".github/workflows/action-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarif-clean-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: SARIF scan of clean fixture must exit 0
        shell: bash
        run: |
          set -euo pipefail
          set +e
          # Root workspace has no owlwarden bin; invoke the built CLI like ci.yml.
          node packages/cli/dist/bin.js scan --ci \
            --fail-on medium \
            --min-confidence likely \
            --format sarif \
            --out /tmp/owlwarden-smoke.sarif \
            fixtures/should-not-fire/next-api-clean
          code=$?
          set -e
          echo "exit-code=${code}"
          test "${code}" -eq 0
          python3 - <<'PY'
          import json
          doc = json.load(open("/tmp/owlwarden-smoke.sarif"))
          assert doc["version"] == "2.1.0"
          assert doc["runs"][0]["tool"]["driver"]["name"] == "owlwarden"
          assert doc["runs"][0]["results"] == []
          print("sarif ok")
          PY
