name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site.url"
      - "scripts/check-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages allows only one in-flight deployment per repo. Cancelling a
# run mid-publish leaves that lock held, and the next push then fails in
# seconds with "in progress deployment". Queue instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: validate and publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the site contract
        run: node scripts/check-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
