name: Release

# Publishing is a build matrix, not a command. The engine is a compiled Rust
# addon, so `owlwarden` on npm is eleven packages: the CLI, the SDK, the config
# resolver, the native loader, and one prebuilt binary package per platform.
# Publishing from a laptop can only produce the binary for that laptop, and
# every other user gets an install that resolves and then fails to load.
#
# It also cannot produce provenance. npm provenance is an attestation signed by
# the CI system that built the artifact; there is no local equivalent, and
# SECURITY.md promises it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything, publish nothing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NODE: 22
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  # Fails the release before anything is built if the five version fields
  # disagree or do not match the tag. npm publishes are immutable, so this is
  # the one mistake with no clean recovery.
  verify:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          package-manager-cache: false
      - name: versions agree with each other and the tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-version.mjs
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.host }}
    strategy:
      # One platform failing should not hide whether the others built. A
      # partial release is not publishable anyway, so there is nothing to gain
      # by stopping early and a diagnosis to lose.
      fail-fast: false
      # Cap concurrency so a busy GitHub Actions pool does not leave every
      # matrix job queued until the free-tier queue timeout cancels them.
      max-parallel: 2
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          # napi-cross supplies the sysroot and linker for glibc targets, so
          # these cross-compile on a plain runner without Docker.
          # Linux glibc and musl both go through zig. napi-cross's aarch64 gcc
          # does not define __ARM_ARCH (ring needs it for --target TLS), and
          # under a busy free-tier runner pool the napi-cross x86_64 jobs were
          # sitting queued until GitHub cancelled them.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: -x
            zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: -x
            zig: true
          # musl matters more than its share of desktops suggests: Alpine is a
          # common CI base image, and CI is where this tool is meant to run.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: -x
            zig: true

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm

      # Zig targets link through cargo-zigbuild. napi installs the crate on
      # demand but not zig itself, and the resulting "Failed to find zig"
      # arrives after a full dependency compile.
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - run: pnpm install --frozen-lockfile

      - name: build the addon
        working-directory: crates/napi
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: the addon must exist and be non-trivial
        shell: bash
        run: |
          # napi exits 0 when a target produces nothing, so check the artifact
          # rather than the exit code. An empty or absent .node here becomes a
          # published package that resolves and then fails to load.
          shopt -s nullglob
          built=(crates/napi/*.node)
          if [ ${#built[@]} -ne 1 ]; then
            echo "::error::expected exactly one .node, found ${#built[@]}"
            exit 1
          fi
          ls -l "${built[0]}"

      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.target }}
          path: crates/napi/*.node
          if-no-files-found: error
          retention-days: 7

      # The loader and its types are generated by the build and are part of the
      # published core-native package. One target is enough — they are platform
      # independent — and Linux is the cheapest runner to take them from.
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: loader
          path: |
            crates/napi/index.js
            crates/napi/index.d.ts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the attestation is signed with a
      # short-lived OIDC token issued to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The loader and its type definitions are generated by the build and are
      # part of what core-native ships, so they come back from the matrix
      # alongside the binaries.
      - name: assemble the platform packages
        working-directory: crates/napi
        shell: bash
        run: |
          set -euo pipefail
          cp ../../artifacts/index.js ../../artifacts/index.d.ts .
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir ../../artifacts --npm-dir npm
          ls -R npm

      # `napi pre-publish` refuses to continue if any platform package is
      # missing its binary, which is the failure that would otherwise reach
      # users as an install that resolves and then cannot load. Run with
      # --dry-run it validates and changes nothing; run for real it injects the
      # optionalDependencies that let npm pick the right binary per platform.
      #
      # --no-gh-release because it is on by default and this workflow does not
      # own the GitHub release; --skip-optional-publish because the publish
      # step below does that itself, so that every package gets provenance.
      - name: validate the platform packages
        if: env.DRY_RUN == 'true'
        working-directory: crates/napi
        run: pnpm exec napi pre-publish --dry-run --skip-optional-publish --no-gh-release

      - name: inject optionalDependencies
        if: env.DRY_RUN != 'true'
        working-directory: crates/napi
        run: pnpm exec napi pre-publish -t npm --skip-optional-publish --no-gh-release

      # `pnpm pack` rewrites `workspace:*` to the concrete version. Packing
      # first and publishing the tarball keeps that rewrite while still using
      # npm to publish, which is what actually knows how to attach provenance.
      #
      # `--out` names each tarball after its publish order rather than after
      # its package. Deriving the filename from the package name means renaming
      # or rescoping a package silently breaks the publish step — and the dry
      # run cannot catch it, because it does not publish.
      - name: pack every package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tarballs && mkdir -p /tmp/tarballs

          # Dependency order. The platform packages are optionalDependencies of
          # the loader, and npm resolves them at install time, so publishing the
          # loader before its binaries leaves a window in which `npm i owlwarden`
          # installs and then fails to load. The CLI goes last for the same
          # reason: nothing should reference a package that is not there yet.
          pack() { ( cd "$2" && pnpm pack --out "/tmp/tarballs/$1.tgz" > /dev/null ); }
          pack 1-core-native crates/napi
          pack 2-sdk         packages/sdk
          pack 3-config      packages/config
          pack 4-cli         packages/cli
          ls -l /tmp/tarballs

      - name: show what each tarball contains
        shell: bash
        run: |
          for t in /tmp/tarballs/*.tgz; do
            echo "=============== $t"
            tar xzOf "$t" package/package.json | head -5
            tar tzf "$t"
          done

      # `npm publish --dry-run` on the real tarballs, in the real order, with
      # the real flags. Without this the publish commands are never executed
      # until the one run where a mistake in them is unrecoverable.
      - name: rehearse the publish
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for dir in crates/napi/npm/*/; do
            npm publish "$dir" --access public --dry-run
          done
          for t in /tmp/tarballs/*.tgz; do
            npm publish "$t" --access public --dry-run
          done

      - name: publish
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in crates/napi/npm/*/; do
            npm publish "$dir" --access public --provenance
          done
          for t in /tmp/tarballs/*.tgz; do
            npm publish "$t" --access public --provenance
          done

      - name: summary
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run — nothing was published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Every target built, and every platform package has its binary." >> "$GITHUB_STEP_SUMMARY"
            echo "Push a \`v*.*.*\` tag to publish for real." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "npx owlwarden@${GITHUB_REF_NAME#v} scan" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
