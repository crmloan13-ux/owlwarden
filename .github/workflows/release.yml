name: Release

# Publishing is a build matrix, not a command. The engine is a compiled Rust
# addon, so `owlwarden` on npm is eleven packages: the CLI, the SDK, the config
# resolver, the native loader, and one prebuilt binary package per platform.
# Publishing from a laptop can only produce the binary for that laptop, and
# every other user gets an install that resolves and then fails to load.
#
# It also cannot produce provenance. npm provenance is an attestation signed by
# the CI system that built the artifact; there is no local equivalent, and
# SECURITY.md promises it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything, publish nothing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NODE: 22
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  # Fails the release before anything is built if the five version fields
  # disagree or do not match the tag. npm publishes are immutable, so this is
  # the one mistake with no clean recovery.
  verify:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE }}
          package-manager-cache: false
      - name: versions agree with each other and the tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-version.mjs
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.host }}
    strategy:
      # One platform failing should not hide whether the others built. A
      # partial release is not publishable anyway, so there is nothing to gain
      # by stopping early and a diagnosis to lose.
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          # napi-cross supplies the sysroot and linker for glibc targets, so
          # these cross-compile on a plain runner without Docker.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: --use-napi-cross
          # musl matters more than its share of desktops suggests: Alpine is a
          # common CI base image, and CI is where this tool is meant to run.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: -x

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm

      # musl links against a different libc, so it is built through zig rather
      # than the host toolchain. napi installs cargo-zigbuild on demand but not
      # zig itself, and the resulting "Failed to find zig" arrives after a full
      # dependency compile.
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - run: pnpm install --frozen-lockfile

      - name: build the addon
        working-directory: crates/napi
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: the addon must exist and be non-trivial
        shell: bash
        run: |
          # napi exits 0 when a target produces nothing, so check the artifact
          # rather than the exit code. An empty or absent .node here becomes a
          # published package that resolves and then fails to load.
          shopt -s nullglob
          built=(crates/napi/*.node)
          if [ ${#built[@]} -ne 1 ]; then
            echo "::error::expected exactly one .node, found ${#built[@]}"
            exit 1
          fi
          ls -l "${built[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: crates/napi/*.node
          if-no-files-found: error
          retention-days: 7

      # The loader and its types are generated by the build and are part of the
      # published core-native package. One target is enough — they are platform
      # independent — and Linux is the cheapest runner to take them from.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: loader
          path: |
            crates/napi/index.js
            crates/napi/index.d.ts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the attestation is signed with a
      # short-lived OIDC token issued to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The loader and its type definitions are generated by the build and are
      # part of what core-native ships, so they come back from the matrix
      # alongside the binaries.
      - name: assemble the platform packages
        working-directory: crates/napi
        shell: bash
        run: |
          set -euo pipefail
          cp ../../artifacts/index.js ../../artifacts/index.d.ts .
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir ../../artifacts --npm-dir npm
          ls -R npm

      # `napi pre-publish` refuses to continue if any platform package is
      # missing its binary, which is the failure that would otherwise reach
      # users as an install that resolves and then cannot load. Run with
      # --dry-run it validates and changes nothing; run for real it injects the
      # optionalDependencies that let npm pick the right binary per platform.
      - name: validate the platform packages
        if: env.DRY_RUN == 'true'
        working-directory: crates/napi
        run: pnpm exec napi pre-publish --dry-run --skip-optional-publish

      - name: inject optionalDependencies
        if: env.DRY_RUN != 'true'
        working-directory: crates/napi
        run: pnpm exec napi pre-publish -t npm --skip-optional-publish

      # `pnpm pack` rewrites `workspace:*` to the concrete version. Packing
      # first and publishing the tarball keeps that rewrite while still using
      # npm to publish, which is what actually knows how to attach provenance.
      - name: pack every package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          for dir in crates/napi packages/sdk packages/config packages/cli; do
            ( cd "$dir" && pnpm pack --pack-destination /tmp/tarballs )
          done
          ls -l /tmp/tarballs

      - name: show what each tarball contains
        shell: bash
        run: |
          for t in /tmp/tarballs/*.tgz; do
            echo "=============== $(basename "$t")"
            tar tzf "$t"
          done

      - name: publish
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Dependency order. The platform packages are optionalDependencies of
          # the loader and npm resolves them at install time, so publishing the
          # loader first leaves a window in which `npm i owlwarden` installs and
          # then fails to load.
          for dir in crates/napi/npm/*/; do
            npm publish "$dir" --access public --provenance
          done

          npm publish /tmp/tarballs/owlwarden-core-native-*.tgz --access public --provenance
          npm publish /tmp/tarballs/owlwarden-sdk-*.tgz --access public --provenance
          npm publish /tmp/tarballs/owlwarden-config-*.tgz --access public --provenance
          npm publish /tmp/tarballs/owlwarden-[0-9]*.tgz --access public --provenance

      - name: summary
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run — nothing was published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Every target built, and every platform package has its binary." >> "$GITHUB_STEP_SUMMARY"
            echo "Push a \`v*.*.*\` tag to publish for real." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "npx owlwarden@${GITHUB_REF_NAME#v} scan" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
