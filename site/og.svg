<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbfaf8"/>

  <g transform="translate(72 60) scale(1.05)">
  
  <rect width="64" height="64" rx="14" fill="#12141a"/>

  <!-- Eye rings in the severity colour the reporter uses for "high", so the
       mark and the report share one accent. -->
  <circle cx="21" cy="33" r="13.4" fill="#c0362c"/>
  <circle cx="43" cy="33" r="13.4" fill="#c0362c"/>

  <!-- The face: one swept stroke from the left horn, down to the point between
       the eyes, and up to the right horn, closed across the brow. Curved rather
       than triangular — straight tufts read as goggles with eyebrows. -->
  <path d="M7.5 33
           C 5.6 20.5, 9.5 10.5, 16.8 6
           C 15.4 15.5, 17.2 22, 22.6 26.6
           L 32 35.4
           L 41.4 26.6
           C 46.8 22, 48.6 15.5, 47.2 6
           C 54.5 10.5, 58.4 20.5, 56.5 33
           C 53 25.6, 47.6 21.6, 41.6 21.4
           L 22.4 21.4
           C 16.4 21.6, 11 25.6, 7.5 33 Z"
        fill="#fbfaf8"/>

  <!-- Eyes. Three rings is the most a 16-pixel render can hold, and it is what
       makes this read as an owl rather than as a face. -->
  <circle cx="21" cy="33" r="10.2" fill="#fbfaf8"/>
  <circle cx="43" cy="33" r="10.2" fill="#fbfaf8"/>
  <circle cx="21" cy="33" r="6.4" fill="#12141a"/>
  <circle cx="43" cy="33" r="6.4" fill="#12141a"/>
  <circle cx="22.3" cy="31.7" r="1.9" fill="#fbfaf8"/>
  <circle cx="44.3" cy="31.7" r="1.9" fill="#fbfaf8"/>

  <!-- The beak. It starts *above* the point where the brow meets rather than at
       it: a beak that merely touches the V leaves two hairline slivers of the
       eye ring showing through, which at 16 pixels is a smudge and at 512 is a
       mistake. Overlapping makes the face one shape. -->
  <path d="M32 27 L27.8 41.4 L32 50 L36.2 41.4 Z" fill="#fbfaf8"/>
</g>
  <text x="152" y="106" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#12141a">owlwarden</text>
  <text x="152" y="136" font-family="Menlo, Consolas, monospace" font-size="17" fill="#5b6272">offline security scanner · Node web apps · AI coding agents</text>

  <rect x="72" y="176" width="1056" height="286" rx="8" fill="#eef0f3" stroke="rgba(18, 20, 26, 0.14)"/>

  <!-- xml:space=preserve, because SVG collapses runs of spaces by default,
       which turns an aligned transcript into a paragraph and moves the
       underline away from the thing it underlines. -->
  <text font-family="Menlo, Consolas, monospace" font-size="19" xml:space="preserve">
    <tspan x="104" y="216" fill="#c0362c" font-weight="700">HIGH</tspan><tspan fill="#1f6f7a">  likely</tspan><tspan fill="#6b7280">  active</tspan><tspan fill="#12141a">  Repository config executes on open</tspan><tspan fill="#6b7280">   ASI05</tspan>
    <tspan x="104" y="248" fill="#6b7280">.claude/settings.json:4:24</tspan>
    <tspan x="104" y="296" fill="#6b7280">3 │</tspan><tspan fill="#12141a">   "hooks": {</tspan>
    <tspan x="104" y="324" fill="#6b7280">4 │</tspan><tspan fill="#12141a">     "SessionStart": [{ "command": "node .claude/setup.mjs" }]</tspan>
    <tspan x="104" y="352" fill="#6b7280">  │</tspan><tspan fill="#c0362c" font-weight="700">                                  ~~~~~~~~~~~~~~~~~~~~~~ runs on open</tspan>
    <tspan x="104" y="380" fill="#6b7280">5 │</tspan><tspan fill="#12141a">   }</tspan>
    <tspan x="104" y="428" fill="#5b6272">↳  fix (Claude Code)  Remove the SessionStart entry, or move the hook to</tspan>
  </text>

  <text x="72" y="524" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#12141a">Your dependency scanner does not read this file.</text>
  <text x="72" y="562" font-family="Menlo, Consolas, monospace" font-size="19" fill="#5b6272">Not a dependency. Not source. Executed anyway.</text>
  <text x="72" y="596" font-family="Menlo, Consolas, monospace" font-size="19" fill="#c0362c">npx owlwarden vet .</text>
</svg>
