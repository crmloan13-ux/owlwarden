<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbfaf8"/>

  <g transform="translate(72 60) scale(1.05)">
  
  <rect width="64" height="64" rx="14" fill="#12141a"/>

  <!-- Short outward tufts, a broad crown, and a tapered lower face. -->
  <g id="owl-head">
    <path d="M10 29
             C10 19.6 18.8 12.5 32 12.5
             C45.2 12.5 54 19.6 54 29
             C54 40.2 47.1 49.2 38.4 53.5
             L32 57
             L25.6 53.5
             C16.9 49.2 10 40.2 10 29Z"
          fill="#fbfaf8"/>
    <path d="M14.8 18.5
             C14.4 15.2 13.5 12.2 12 9.5
             C16.1 11 19.3 12.9 21.5 15.2
             C18.7 15.8 16.5 16.9 14.8 18.5Z"
          fill="#fbfaf8"/>
    <path d="M42.5 15.2
             C44.7 12.9 47.9 11 52 9.5
             C50.5 12.2 49.6 15.2 49.2 18.5
             C47.5 16.9 45.3 15.8 42.5 15.2Z"
          fill="#fbfaf8"/>
  </g>

  <!-- One facial disc rather than two separate goggle rings. -->
  <g id="owl-face">
    <path d="M12 31
             C12 23.2 19.7 18.2 28.2 20.2
             C29.8 20.6 31 21.4 32 22.6
             C33 21.4 34.2 20.6 35.8 20.2
             C44.3 18.2 52 23.2 52 31
             C52 39.8 44.5 46.2 35.8 44.6
             C34.1 44.3 32.9 43.5 32 42.3
             C31.1 43.5 29.9 44.3 28.2 44.6
             C19.5 46.2 12 39.8 12 31Z"
          fill="#c0362c"/>
  </g>

  <g id="owl-eyes">
    <circle cx="22" cy="31.5" r="9.6" fill="#fbfaf8"/>
    <circle cx="42" cy="31.5" r="9.6" fill="#fbfaf8"/>
    <circle cx="22" cy="31.5" r="5.3" fill="#12141a"/>
    <circle cx="42" cy="31.5" r="5.3" fill="#12141a"/>
    <circle cx="23.4" cy="30" r="1.15" fill="#fbfaf8"/>
    <circle cx="43.4" cy="30" r="1.15" fill="#fbfaf8"/>
  </g>

</g>
  <text x="152" y="106" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#12141a">owlwarden</text>
  <text x="152" y="136" font-family="Menlo, Consolas, monospace" font-size="17" fill="#5b6272">local security checks for Node apps and coding-agent config</text>

  <rect x="72" y="176" width="1056" height="286" rx="8" fill="#eef0f3" stroke="rgba(18, 20, 26, 0.14)"/>

  <!-- xml:space=preserve, because SVG collapses runs of spaces by default,
       which turns an aligned transcript into a paragraph and moves the
       underline away from the thing it underlines. -->
  <text font-family="Menlo, Consolas, monospace" font-size="19" xml:space="preserve">
    <tspan x="104" y="216" fill="#c0362c" font-weight="700">HIGH</tspan><tspan fill="#1f6f7a">  likely</tspan><tspan fill="#6b7280">  active</tspan><tspan fill="#12141a">  Repository config executes on open</tspan><tspan fill="#6b7280">   ASI05</tspan>
    <tspan x="104" y="248" fill="#6b7280">.claude/settings.json:4:24</tspan>
    <tspan x="104" y="296" fill="#6b7280">3 │</tspan><tspan fill="#12141a">   "hooks": {</tspan>
    <tspan x="104" y="324" fill="#6b7280">4 │</tspan><tspan fill="#12141a">     "SessionStart": [{ "command": "node .claude/setup.mjs" }]</tspan>
    <tspan x="104" y="352" fill="#6b7280">  │</tspan><tspan fill="#c0362c" font-weight="700">                                  ~~~~~~~~~~~~~~~~~~~~~~ runs on open</tspan>
    <tspan x="104" y="380" fill="#6b7280">5 │</tspan><tspan fill="#12141a">   }</tspan>
    <tspan x="104" y="428" fill="#5b6272">↳  fix (Claude Code)  Remove the SessionStart entry, or move the hook to</tspan>
  </text>

  <text x="72" y="524" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#12141a">Agent startup hooks sit outside dependency scanning.</text>
  <text x="72" y="562" font-family="Menlo, Consolas, monospace" font-size="19" fill="#5b6272">Check repository agent config before opening it.</text>
  <text x="72" y="596" font-family="Menlo, Consolas, monospace" font-size="19" fill="#c0362c">npx owlwarden vet .</text>
</svg>
