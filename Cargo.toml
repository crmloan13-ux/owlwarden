[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/static-engine",
    "crates/detectors",
    "crates/transport",
    "crates/dynamic-engine",
    "crates/reporters",
    "crates/plugin-host",
    "crates/napi",
    "crates/cli-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suthat/owlwarden"
homepage = "https://github.com/suthat/owlwarden"
authors = ["owlwarden contributors"]
keywords = ["security", "sast", "owasp", "scanner", "static-analysis"]
categories = ["development-tools", "web-programming"]

[workspace.dependencies]
owlwarden-core = { path = "crates/core", version = "0.1.0" }
owlwarden-static = { path = "crates/static-engine", version = "0.1.0" }
owlwarden-detectors = { path = "crates/detectors", version = "0.1.0" }
owlwarden-transport = { path = "crates/transport", version = "0.1.0" }
owlwarden-dynamic = { path = "crates/dynamic-engine", version = "0.1.0" }
owlwarden-reporters = { path = "crates/reporters", version = "0.1.0" }
owlwarden-plugin-host = { path = "crates/plugin-host", version = "0.1.0" }

async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

# Static engine: oxc is pinned exactly — AST shape is not semver-stable enough
# to float, and a silent parser change is a silent detector change.
oxc_allocator = "=0.143.0"
oxc_ast = "=0.143.0"
oxc_ast_visit = "=0.143.0"
oxc_parser = "=0.143.0"
oxc_span = "=0.143.0"
oxc_syntax = "=0.143.0"

ignore = "0.4"
globset = "0.4"

# Plugin host: wasmtime is the *only* crate allowed to bring wasmtime into the
# workspace (ARCHITECTURE.md §3, ADR 0015). Floored at 36.0.13, not merely
# "26" or "28": every wasmtime release below 36.0.13 has an open RUSTSEC
# advisory as of this writing, several of them sandbox escapes — shipping one
# in the plugin host would be the exact failure AGENTS.md warns against ("the
# tool must not become the vulnerability it hunts"). 36.0.13's MSRV (1.86)
# still sits under our own (1.88); `cargo deny check` re-verifies this on
# every build. anyhow is already a transitive dependency of wasmtime and is
# needed directly because host functions signal a trap by returning
# `Err(anyhow::Error)`. `wat` is dev-only: it assembles the adversarial
# modules in the sandbox-escape suite without checking in hand-written
# `.wasm` binaries.
wasmtime = { version = "36.0.13", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
anyhow = "1"
wat = "1"

# Terminal output. anstream gives us correct ANSI handling on Windows consoles.
anstream = "0.6"
anstyle = "1"

insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Deliberately NOT panic = "abort": the napi addon runs inside the user's Node
# process, and napi-rs converts an unwinding panic into a JS exception. Aborting
# would take down the host process instead.
