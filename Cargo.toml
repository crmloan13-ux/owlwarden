[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/static-engine",
    "crates/detectors",
    "crates/seal",
    "crates/bench",
    "crates/gate",
    "crates/transport",
    "crates/dynamic-engine",
    "crates/reporters",
    "crates/plugin-host",
    "crates/napi",
    "crates/cli-native",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suthat/owlwarden"
homepage = "https://github.com/suthat/owlwarden"
authors = ["owlwarden contributors"]
keywords = ["security", "sast", "owasp", "scanner", "static-analysis"]
categories = ["development-tools", "web-programming"]

[workspace.dependencies]
owlwarden-core = { path = "crates/core", version = "1.3.0" }
owlwarden-static = { path = "crates/static-engine", version = "1.3.0" }
owlwarden-detectors = { path = "crates/detectors", version = "1.3.0" }
owlwarden-gate = { path = "crates/gate", version = "1.3.0" }
owlwarden-transport = { path = "crates/transport", version = "1.3.0" }
owlwarden-dynamic = { path = "crates/dynamic-engine", version = "1.3.0" }
owlwarden-reporters = { path = "crates/reporters", version = "1.3.0" }
owlwarden-plugin-host = { path = "crates/plugin-host", version = "1.3.0" }
owlwarden-seal = { path = "crates/seal", version = "1.3.0" }
owlwarden-bench = { path = "crates/bench", version = "1.3.0" }

async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

# Static engine: oxc is pinned exactly — AST shape is not semver-stable enough
# to float, and a silent parser change is a silent detector change.
oxc_allocator = "=0.147.0"
oxc_ast = "=0.147.0"
oxc_ast_visit = "=0.147.0"
oxc_parser = "=0.147.0"
oxc_span = "=0.147.0"
oxc_syntax = "=0.147.0"

ignore = "0.4"
globset = "0.4"

# Plugin host: wasmtime is the *only* crate allowed to bring wasmtime into the
# workspace (ARCHITECTURE.md §3, ADR 0015). Floored at 36.0.14, not merely
# "26" or "28": every wasmtime release below this floor has an open RUSTSEC
# advisory, several of them sandbox escapes — shipping one in the plugin host
# would be the exact failure AGENTS.md warns against ("the tool must not become
# the vulnerability it hunts").
#
# The floor moves when a new advisory lands, and it has already moved once:
# 36.0.13 was clean when 1.2 shipped and picked up RUSTSEC-2026-0269 (a
# filesystem sandbox escape through trailing slashes in paths and symlinks)
# before 1.3 did. That is not a reason to loosen the pin — it is the reason the
# pin is a floor with a comment rather than a caret range nobody reads. The
# advisory was found by `cargo deny check` in CI, which is the job that check
# exists to do.
#
# 36.0.14's MSRV (1.86) still sits under our own (1.88); `cargo deny check`
# re-verifies this on every build. anyhow is already a transitive dependency of
# wasmtime and is needed directly because host functions signal a trap by
# returning `Err(anyhow::Error)`. `wat` is dev-only: it assembles the
# adversarial modules in the sandbox-escape suite without checking in
# hand-written `.wasm` binaries.
wasmtime = { version = "38.0.4", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
anyhow = "1"
wat = "1"

# Terminal output. anstream gives us correct ANSI handling on Windows consoles.
anstream = "1.0"
anstyle = "1"

insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Deliberately NOT panic = "abort": the napi addon runs inside the user's Node
# process, and napi-rs converts an unwinding panic into a JS exception. Aborting
# would take down the host process instead.
